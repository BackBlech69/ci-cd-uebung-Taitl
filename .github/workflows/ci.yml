name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-pipeline
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------
  # Matrix Build and Unit Tests
  # -----------------------------------------
  build-and-test:
    name: Build and Test (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
        exclude:
          - os: windows-latest
            java: '21'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode clean verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-${{ matrix.os }}-java${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-${{ matrix.os }}-java${{ matrix.java }}
          path: target/site/jacoco/
          if-no-files-found: warn

  # -----------------------------------------
  # SonarQube Cloud Analysis
  # -----------------------------------------
  sonarcloud:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, Test and Generate Coverage
        run: mvn --batch-mode clean verify

      - name: SonarQube Cloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn --batch-mode
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=BackBlech69_ci-cd-uebung-Taitl
          -Dsonar.organization=backblech69
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  # -----------------------------------------
  # Docker Image Build and Artifact
  # -----------------------------------------
  docker:
    name: Docker Build and Artifact
    runs-on: ubuntu-latest
    needs: [build-and-test, sonarcloud]

    # Runs after tests and Sonar. Sonar only runs on push to main,
    # so a skipped Sonar job (e.g. on pull requests) must not block this job.
    if: >-
      ${{ !cancelled()
      && needs.build-and-test.result == 'success'
      && (needs.sonarcloud.result == 'success' || needs.sonarcloud.result == 'skipped') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (single-arch, loaded into local Docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: local/app:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: docker run --rm local/app:${{ steps.vars.outputs.sha }}

      - name: Save image as tar
        run: docker save local/app:${{ steps.vars.outputs.sha }} -o image-${{ steps.vars.outputs.sha }}.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ steps.vars.outputs.sha }}
          path: image-${{ steps.vars.outputs.sha }}.tar
          if-no-files-found: error
          retention-days: 7
